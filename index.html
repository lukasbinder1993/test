<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tonguebox Benutzer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#10232a}main{max-width:700px;margin:auto;padding:12px}
h1{text-align:center;font-size:40px}.note,.status{border:2px solid #087f8c;border-radius:18px;padding:12px;text-align:center;margin:12px 0;font-weight:bold}
.acc{border:2px solid #ccd8dc;border-radius:20px;margin:16px 0;overflow:hidden}.head{width:100%;min-height:108px;border:0;background:#eaf5f6;padding:18px;font-size:24px;font-weight:bold;text-align:left}.panel{display:none;padding:14px}.panel.open{display:block}
button,input,textarea{font:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:7px solid #ffd400;outline-offset:3px}
input,textarea{width:100%;border:3px solid #ccd8dc;border-radius:17px;padding:14px;font-size:21px;margin:6px 0}textarea{min-height:110px}
.action,.phrase{width:100%;min-height:100px;border:0;border-radius:18px;padding:14px;font-size:22px;font-weight:bold;margin:6px 0}.action{background:#087f8c;color:white}.phrase{background:#edf3f4;color:#10232a}.delete{background:#fff0ef;color:#a61b13}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.action,.phrase,.head{min-height:110px}}
</style></head>
<body><main>
<h1>🧠 Tonguebox</h1>
<div class="note">✨ KI-generierte Vorschläge · Internet erforderlich<br>👤 Eigene Phrasen pro Benutzer</div>
<div class="status" id="status">Aktiver Benutzer: <span id="active">Gast</span></div>

<section class="acc"><button class="head" data-id="ai">⚡ KI-Antworten ▾</button><div class="panel open" id="ai"><div class="grid" id="answers"></div></div></section>
<section class="acc"><button class="head" data-id="questionPanel">🧠 Frage beantworten ▾</button><div class="panel" id="questionPanel"><textarea id="question" placeholder="Frage eingeben"></textarea><button class="action" id="ask">✨ KI-Antworten erzeugen</button></div></section>
<section class="acc"><button class="head" data-id="phrasesPanel">💬 Meine Phrasen ▾</button><div class="panel" id="phrasesPanel"><textarea id="newPhrase" placeholder="Eigene Phrase eingeben"></textarea><button class="action" id="savePhrase">➕ Phrase speichern</button><div id="phrases"></div></div></section>
<section class="acc"><button class="head" data-id="usersPanel">👤 Benutzer ▾</button><div class="panel" id="usersPanel"><input id="newUser" placeholder="Benutzername"><button class="action" id="addUser">➕ Benutzer anlegen</button><div id="users"></div></div></section>
<section class="acc"><button class="head" data-id="speakPanel">🔊 Selbst sprechen ▾</button><div class="panel" id="speakPanel"><textarea id="own" placeholder="Text schreiben"></textarea><button class="action" id="speakOwn">🔊 Sprechen</button></div></section>
</main>
<script>
const ENDPOINT="https://tonguebox-ai.restless-bush-f37f.workers.dev/";
const UKEY="tonguebox_users_v1",AKEY="tonguebox_active_v1";
const $=id=>document.getElementById(id);
function users(){try{return JSON.parse(localStorage.getItem(UKEY))||{Gast:{phrases:[]}}}catch(e){return {Gast:{phrases:[]}}}}
function save(u){localStorage.setItem(UKEY,JSON.stringify(u))}
function active(){return localStorage.getItem(AKEY)||"Gast"}
function phrases(){let u=users();return u[active()]?.phrases||[]}
function say(t){if(!t)return;speechSynthesis.cancel();let x=new SpeechSynthesisUtterance(t);x.lang="de-AT";speechSynthesis.speak(x)}
function renderAnswers(a){let f=["Ja.","Nein.","Einen Moment bitte.","Bitte wiederholen."];a=Array.isArray(a)?a.slice(0,4):[];while(a.length<4)a.push(f[a.length]);$("answers").innerHTML="";a.forEach(t=>{let b=document.createElement("button");b.className="action";b.textContent=t;b.onclick=()=>say(t);$("answers").appendChild(b)})}
function renderPhrases(){$("phrases").innerHTML="";phrases().forEach(t=>{let b=document.createElement("button");b.className="phrase";b.textContent=t;b.onclick=()=>say(t);let d=document.createElement("button");d.className="phrase delete";d.textContent="🗑 "+t;d.onclick=()=>{let u=users();u[active()].phrases=u[active()].phrases.filter(x=>x!==t);save(u);renderPhrases()};$("phrases").append(b,d)})}
function renderUsers(){$("active").textContent=active();$("users").innerHTML="";Object.keys(users()).forEach(n=>{let b=document.createElement("button");b.className="phrase";b.textContent=(n===active()?"✓ ":"👤 ")+n;b.onclick=()=>{localStorage.setItem(AKEY,n);renderAll()};$("users").appendChild(b)})}
function renderAll(){renderUsers();renderPhrases()}
$("savePhrase").onclick=()=>{let t=$("newPhrase").value.trim();if(!t)return;let u=users(),n=active();if(!u[n])u[n]={phrases:[]};if(!u[n].phrases.includes(t))u[n].phrases.push(t);save(u);$("newPhrase").value="";renderPhrases()}
$("addUser").onclick=()=>{let n=$("newUser").value.trim().replace(/[<>]/g,"").slice(0,30);if(!n)return;let u=users();if(!u[n])u[n]={phrases:[]};save(u);localStorage.setItem(AKEY,n);$("newUser").value="";renderAll()}
$("ask").onclick=async()=>{let q=$("question").value.trim();if(!q)return;$("status").textContent="✨ KI erstellt Antworten …";try{let r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,preferred_phrases:phrases().slice(0,30)})});let d=await r.json();if(!r.ok)throw Error(d.detail||d.error);renderAnswers(d.replies);$("status").innerHTML="✨ KI-Antworten für <span id='active'>"+active()+"</span> bereit";open("ai")}catch(e){$("status").textContent="KI-Fehler: "+e.message}}
$("speakOwn").onclick=()=>say($("own").value.trim());
function open(id){document.querySelectorAll(".panel").forEach(p=>p.classList.remove("open"));$(id).classList.add("open");document.querySelector('[data-id="'+id+'"]').scrollIntoView({behavior:"smooth",block:"start"})}
document.querySelectorAll(".head").forEach(b=>b.onclick=()=>{let p=$(b.dataset.id);p.classList.contains("open")?p.classList.remove("open"):open(b.dataset.id)});
renderAnswers([]);renderAll();
</script></body></html>
