<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tonguebox – KI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#10232a;background:#fff;font-size:20px}main{max-width:720px;margin:auto;padding:14px 12px 60px}h1{text-align:center;font-size:44px;margin:8px 0}.sub,.status{text-align:center;font-weight:700}.note{border:2px solid #087f8c;background:#eefafb;border-radius:18px;padding:14px;text-align:center;font-weight:700;margin:12px 0}.top,.answers,.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big,.answer,.full,.quick button,.acc-head{border:0;border-radius:20px;font-weight:800;font-size:23px;min-height:90px;padding:14px}.start,.answer,.full{background:#087f8c;color:#fff}.stop,.quick button{background:#edf2f3;color:#10232a}.answer{min-height:115px}.question{border:2px solid #cfd8dc;background:#f4f8f9;border-radius:18px;padding:14px;min-height:76px;margin:14px 0}.question small{display:block;font-size:15px;font-weight:700}.status{min-height:30px;margin:10px}.error{color:#9b1c1c}.acc{border:2px solid #cfd8dc;border-radius:20px;overflow:hidden;margin:14px 0}.acc-head{width:100%;background:#eaf5f6;text-align:left;display:flex;justify-content:space-between;align-items:center}.panel{display:none;padding:14px}.panel.open{display:block}textarea{width:100%;min-height:125px;border:3px solid #cfd8dc;border-radius:18px;padding:14px;font:inherit;font-size:22px}.full{width:100%;margin-top:12px}button:focus-visible,textarea:focus-visible{outline:7px solid #ffd400;outline-offset:3px}/* Blickerfassung / iPhone: große, klar getrennte Ziele */
button{
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.top{gap:18px}
.answers{gap:18px}
.big{
  min-height:112px;
  font-size:26px;
}
.answer{
  min-height:132px;
  font-size:25px;
  padding:20px 16px;
}
.acc{margin:20px 0}
.acc-head{
  min-height:112px;
  font-size:26px;
  padding:20px;
}
.quick{gap:16px}
.quick button{
  min-height:112px;
  font-size:24px;
  padding:18px 12px;
}
.full{
  min-height:106px;
  font-size:25px;
}
button:focus,
button:focus-visible,
textarea:focus,
textarea:focus-visible{
  outline:7px solid #ffd400;
  outline-offset:4px;
}
@media(max-width:600px){
  main{padding:12px 12px 70px}
  .top{grid-template-columns:1fr 1fr;gap:14px}
  .answers{grid-template-columns:1fr;gap:16px}
  .answer{min-height:118px;font-size:24px}
  .quick{grid-template-columns:1fr 1fr;gap:14px}
  .quick button{min-height:108px}
  .big,.acc-head{min-height:108px}
}
@media(max-width:390px){
  .top{grid-template-columns:1fr}
  .quick{grid-template-columns:1fr}
  .big,.answer,.quick button,.acc-head,.full{min-height:104px}
}

.loginbox{border:3px solid #087f8c;border-radius:22px;padding:18px;margin:16px 0;background:#f5fbfc}
.loginbox input{width:100%;min-height:76px;border:3px solid #cfd8dc;border-radius:16px;padding:12px;font:inherit;font-size:22px;margin:7px 0}
.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}.userline{text-align:center;font-weight:800;margin:10px 0}
.phrase-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin:10px 0}.phrase-row button{min-height:90px;border:0;border-radius:18px;font-size:21px;font-weight:800}
.phrase-say{background:#087f8c;color:#fff}.phrase-del{background:#f4e7e7;color:#7b1010;min-width:92px}.hidden{display:none!important}
@media(max-width:480px){.login-actions{grid-template-columns:1fr}}
</style></head><body><main>
<h1>🧠 Tonguebox</h1><p class="sub">Sprich mit deinen Augen</p>
<div class="note">✨ KI-generierte Antwortvorschläge<br>Internetverbindung erforderlich</div><div class="loginbox" id="loginBox"><div class="userline">👤 Persönliches Profil</div><input id="username" autocomplete="username" placeholder="Benutzername"><input id="password" type="password" autocomplete="current-password" placeholder="Passwort"><div class="login-actions"><button class="full" id="loginBtn">🔓 Anmelden</button><button class="full" id="registerBtn">➕ Registrieren</button></div><div class="status" id="loginStatus">Noch nicht angemeldet.</div></div><div class="loginbox hidden" id="profileBox"><div class="userline">👤 Angemeldet als <span id="currentUser"></span></div><button class="full" id="logoutBtn">🚪 Abmelden</button></div>
<div class="status" id="status" role="status" aria-live="polite">Bereit.</div>

<div class="acc">
  <button class="acc-head" aria-expanded="false" data-panel="listenPanel">🎧 Frage erkennen <span>⌄</span></button>
  <div class="panel" id="listenPanel">
    <div class="top">
      <button class="big start" id="listen" aria-label="Zuhören starten">🎧 Zuhören</button>
      <button class="big stop" id="stop" aria-label="Zuhören stoppen">⏹ Stopp</button>
    </div>
    <div class="question"><small>Erkannte Frage</small><span id="question">Noch keine Frage erkannt.</span></div>
  </div>
</div>

<div class="acc">
  <button class="acc-head" aria-expanded="false" data-panel="answerPanel">⚡ KI-Antworten <span>⌄</span></button>
  <div class="panel" id="answerPanel">
    <div class="answers" id="answers" role="group" aria-label="KI Antwortvorschläge"></div>
  </div>
</div>

<div class="acc">
  <button class="acc-head" aria-expanded="false" data-panel="quick">💬 Sofort-Kommunikation <span>⌄</span></button>
  <div class="panel" id="quick">
    <div class="quick">
      <button data-say="Ja.">✅ Ja</button>
      <button data-say="Nein.">❌ Nein</button>
      <button data-say="Einen Moment bitte.">⏳ Moment</button>
      <button data-say="Bitte wiederholen.">🔁 Wiederholen</button>
      <button data-say="Bitte langsamer sprechen.">🐢 Langsamer</button>
      <button data-say="Ich brauche bitte Hilfe.">🙏 Hilfe</button>
    </div>
  </div>
</div>

<div class="acc"><button class="acc-head" aria-expanded="false" data-panel="myPhrases">⭐ Meine Phrasen <span>⌄</span></button><div class="panel" id="myPhrases"><textarea id="newPhrase" placeholder="Eigene Phrase eingeben"></textarea><button class="full" id="savePhrase">➕ Phrase speichern</button><div id="phraseList"></div></div></div>

<div class="acc">
  <button class="acc-head" aria-expanded="false" data-panel="manual">✍️ Selbst schreiben <span>⌄</span></button>
  <div class="panel" id="manual">
    <textarea id="text" placeholder="Frage oder eigenen Satz eingeben"></textarea>
    <button class="full" id="ask">✨ KI-Antworten erzeugen</button>
    <button class="full" id="sayOwn">🔊 Meinen Text sprechen</button>
  </div>
</div>
</main><script>
const ENDPOINT="https://tonguebox-ai.restless-bush-f37f.workers.dev/";const USERS_ENDPOINT="https://tonguebox-users.restless-bush-f37f.workers.dev/";let authToken=localStorage.getItem("tonguebox_token")||"";let personalPhrases=[];
const answers=document.getElementById("answers"),statusEl=document.getElementById("status"),qEl=document.getElementById("question"),textEl=document.getElementById("text");
let rec=null,wantListen=false,speaking=false;
function status(t,e=false){statusEl.textContent=t;statusEl.classList.toggle("error",e)}
function speak(t){if(!t)return;speaking=true;if(rec)try{rec.stop()}catch(e){};speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-AT";u.onend=u.onerror=()=>{speaking=false;if(wantListen)start()};speechSynthesis.speak(u)}
function render(a){const f=["Ja.","Nein.","Einen Moment bitte.","Bitte wiederholen."];a=Array.isArray(a)?a.filter(Boolean).slice(0,4):[];while(a.length<4)a.push(f[a.length]);answers.innerHTML="";a.forEach(t=>{const b=document.createElement("button");b.className="answer";b.textContent=t;b.onclick=()=>speak(t);answers.appendChild(b)})}
function openPanel(id){
  document.querySelectorAll(".acc-head").forEach(x=>{
    const p=document.getElementById(x.dataset.panel);
    const yes=x.dataset.panel===id;
    x.setAttribute("aria-expanded",yes?"true":"false");
    if(p)p.classList.toggle("open",yes);
  });
  const h=document.querySelector('.acc-head[data-panel="'+id+'"]');
  if(h)setTimeout(()=>h.scrollIntoView({behavior:"smooth",block:"start"}),80);
}
render(["Ja.","Nein.","Einen Moment bitte.","Bitte wiederholen."]);
async function askAI(q){q=(q||"").trim();if(!q){status("Bitte zuerst eine Frage eingeben.",true);return}qEl.textContent=q;status("✨ KI erstellt Antworten …");try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,personalPhrases:personalPhrases.slice(0,30)})});const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||"HTTP "+r.status);if(!Array.isArray(d.replies))throw new Error("Keine Antworten erhalten");render(d.replies);status("✨ KI-generierte Antworten sind bereit.");openPanel("answerPanel")}catch(e){console.error(e);status("KI-Verbindung nicht erreichbar. Sofort-Antworten bleiben verfügbar.",true)}}
function start(){if(!rec||speaking||!wantListen)return;try{rec.start();status("🎧 Ich höre zu …")}catch(e){}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.lang="de-AT";rec.continuous=false;rec.interimResults=true;rec.onresult=e=>{let fin="",inter="";for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;e.results[i].isFinal?fin+=t:inter+=t}qEl.textContent=fin||inter||"Ich höre zu …";if(fin.trim())askAI(fin)};rec.onend=()=>{if(wantListen&&!speaking)setTimeout(start,500)};rec.onerror=e=>{if(e.error!=="aborted")status("Spracherkennung: "+e.error,true)}}else{document.getElementById("listen").disabled=true;status("Automatisches Zuhören wird in diesem Browser nicht unterstützt. Bitte „Selbst schreiben“ verwenden.",true)}
document.getElementById("listen").onclick=()=>{wantListen=true;start()};document.getElementById("stop").onclick=()=>{wantListen=false;if(rec)try{rec.stop()}catch(e){};status("Zuhören gestoppt.")};document.getElementById("ask").onclick=()=>askAI(textEl.value);document.getElementById("sayOwn").onclick=()=>speak(textEl.value.trim());document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
document.querySelectorAll(".acc-head").forEach(h=>h.onclick=()=>{const open=h.getAttribute("aria-expanded")!=="true";document.querySelectorAll(".acc-head").forEach(x=>{x.setAttribute("aria-expanded","false");document.getElementById(x.dataset.panel).classList.remove("open")});if(open){h.setAttribute("aria-expanded","true");document.getElementById(h.dataset.panel).classList.add("open");setTimeout(()=>h.scrollIntoView({behavior:"smooth",block:"start"}),50)}});openPanel("listenPanel");

async function userApi(action,data={}){const r=await fetch(USERS_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",...(authToken?{"Authorization":"Bearer "+authToken}:{})},body:JSON.stringify({action,...data})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Serverfehler");return d}
function renderPhrases(){const box=document.getElementById("phraseList");box.innerHTML="";if(!personalPhrases.length){box.innerHTML="<p>Noch keine eigenen Phrasen gespeichert.</p>";return}personalPhrases.forEach(p=>{const row=document.createElement("div");row.className="phrase-row";const a=document.createElement("button");a.className="phrase-say";a.textContent=p;a.onclick=()=>speak(p);const d=document.createElement("button");d.className="phrase-del";d.textContent="🗑️";d.setAttribute("aria-label","Phrase löschen");d.onclick=async()=>{try{const x=await userApi("deletePhrase",{phrase:p});personalPhrases=x.phrases||[];renderPhrases()}catch(e){status(e.message,true)}};row.append(a,d);box.append(row)})}
function loggedIn(name){document.getElementById("loginBox").classList.add("hidden");document.getElementById("profileBox").classList.remove("hidden");document.getElementById("currentUser").textContent=name}
function loggedOut(){authToken="";personalPhrases=[];localStorage.removeItem("tonguebox_token");document.getElementById("profileBox").classList.add("hidden");document.getElementById("loginBox").classList.remove("hidden");renderPhrases()}
async function auth(action){const username=document.getElementById("username").value.trim(),password=document.getElementById("password").value,ls=document.getElementById("loginStatus");if(!username||password.length<6){ls.textContent="Benutzername und Passwort (mindestens 6 Zeichen) eingeben.";return}ls.textContent="Bitte warten …";try{const d=await userApi(action,{username,password});authToken=d.token;localStorage.setItem("tonguebox_token",authToken);personalPhrases=d.phrases||[];loggedIn(d.username);renderPhrases()}catch(e){ls.textContent=e.message}}
document.getElementById("loginBtn").onclick=()=>auth("login");document.getElementById("registerBtn").onclick=()=>auth("register");document.getElementById("logoutBtn").onclick=async()=>{try{await userApi("logout")}catch(e){}loggedOut()};
document.getElementById("savePhrase").onclick=async()=>{const phrase=document.getElementById("newPhrase").value.trim();if(!authToken){status("Bitte zuerst anmelden.",true);return}if(!phrase)return;try{const d=await userApi("addPhrase",{phrase});personalPhrases=d.phrases||[];document.getElementById("newPhrase").value="";renderPhrases();status("Phrase gespeichert.")}catch(e){status(e.message,true)}};
(async()=>{renderPhrases();if(authToken)try{const d=await userApi("me");personalPhrases=d.phrases||[];loggedIn(d.username);renderPhrases()}catch(e){loggedOut()}})();
</script></body></html>
