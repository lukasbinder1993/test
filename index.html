<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Tonguebox – Blickgesteuerte Kommunikation</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #fff;
  color: #10232a;
  font-size: 20px;
}

main {
  max-width: 760px;
  margin: auto;
  padding: 14px 12px 80px;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin: 10px 0 4px;
}

.sub {
  text-align: center;
  font-weight: 800;
  margin-bottom: 14px;
}

.info {
  padding: 14px;
  border: 2px solid #087f8c;
  border-radius: 18px;
  background: #eefafb;
  text-align: center;
  font-weight: 700;
  margin-bottom: 15px;
}

.status {
  text-align: center;
  font-weight: 800;
  min-height: 32px;
  margin: 12px;
}

.error {
  color: #9b1c1c;
}

/* MODUS */

.mode {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 18px;
}

.mode button {
  min-height: 115px;
  border: 0;
  border-radius: 22px;
  font-size: 25px;
  font-weight: 900;
  padding: 16px;
}

.mode-active {
  background: #087f8c;
  color: white;
}

.mode-inactive {
  background: #edf2f3;
  color: #10232a;
}

/* AKKORDEON */

.acc {
  border: 2px solid #cfd8dc;
  border-radius: 22px;
  overflow: hidden;
  margin: 18px 0;
}

.acc-head {
  width: 100%;
  min-height: 110px;
  border: 0;
  padding: 18px;
  background: #eaf5f6;
  color: #10232a;
  text-align: left;
  font-size: 25px;
  font-weight: 900;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel {
  display: none;
  padding: 15px;
}

.panel.open {
  display: block;
}

/* EINGABEN */

textarea,
input {
  width: 100%;
  border: 3px solid #cfd8dc;
  border-radius: 18px;
  padding: 16px;
  font: inherit;
  font-size: 23px;
}

textarea {
  min-height: 140px;
  resize: vertical;
}

input {
  min-height: 78px;
  margin-bottom: 12px;
}

/* BUTTONS */

.full,
.answer,
.quick button,
.yes,
.no {
  border: 0;
  border-radius: 22px;
  font-weight: 900;
  font-size: 24px;
  padding: 18px 14px;
}

.full {
  width: 100%;
  min-height: 105px;
  margin-top: 14px;
  background: #087f8c;
  color: white;
}

.answers {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}

.answer {
  width: 100%;
  min-height: 125px;
  background: #087f8c;
  color: white;
}

.quick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.quick button {
  min-height: 110px;
  background: #edf2f3;
  color: #10232a;
}

/* JA / NEIN */

.yesno {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-bottom: 18px;
}

.yes,
.no {
  min-height: 150px;
  font-size: 32px;
}

.yes {
  background: #087f8c;
  color: white;
}

.no {
  background: #edf2f3;
  color: #10232a;
}

/* ERKANNTE FRAGE */

.question {
  border: 3px solid #cfd8dc;
  border-radius: 18px;
  background: #f4f8f9;
  padding: 16px;
  min-height: 90px;
  margin-bottom: 15px;
}

.question small {
  display: block;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 8px;
}

/* PROFIL */

.phrase {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  margin-top: 12px;
}

.phrase button {
  min-height: 90px;
  border: 0;
  border-radius: 18px;
  font-size: 21px;
  font-weight: 800;
  padding: 14px;
}

.phrase .speak {
  background: #087f8c;
  color: white;
}

.phrase .delete {
  background: #edf2f3;
}

/* FOKUS FÜR BLICKERFASSUNG */

button {
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  cursor: pointer;
}

button:focus,
button:focus-visible,
textarea:focus,
textarea:focus-visible,
input:focus,
input:focus-visible {
  outline: 7px solid #ffd400;
  outline-offset: 4px;
}

/* TELEFONMODUS */

body.phone-mode .acc-head {
  min-height: 120px;
}

body.phone-mode .answer {
  min-height: 145px;
  font-size: 26px;
}

/* MOBILE */

@media(max-width:600px) {

  main {
    padding: 12px 12px 80px;
  }

  h1 {
    font-size: 37px;
  }

  .mode {
    grid-template-columns: 1fr 1fr;
  }

  .quick {
    grid-template-columns: 1fr 1fr;
  }

  .yes,
  .no {
    min-height: 145px;
  }
}

@media(max-width:390px) {

  .mode {
    grid-template-columns: 1fr;
  }

  .quick {
    grid-template-columns: 1fr;
  }

  .yesno {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<main>

<h1>👁 Tonguebox</h1>

<p class="sub">
Sprich mit deinen Augen
</p>

<div class="info">
Blickoptimierte Kommunikation mit adaptiven Antwortvorschlägen
</div>

<div
  class="status"
  id="status"
  role="status"
  aria-live="polite">
Bereit.
</div>


<!-- MODUS -->

<div class="mode">

<button
  id="communicationMode"
  class="mode-active">
💬 Kommunikation
</button>

<button
  id="phoneMode"
  class="mode-inactive">
📞 Telefon
</button>

</div>


<!-- JA / NEIN -->

<div class="acc">

<button
  class="acc-head"
  aria-expanded="true"
  data-panel="yesNoPanel">

<span>⚡ Schnell antworten</span>
<span>⌃</span>

</button>

<div
  class="panel open"
  id="yesNoPanel">

<div class="yesno">

<button
  class="yes"
  data-say="Ja.">
✅ JA
</button>

<button
  class="no"
  data-say="Nein.">
❌ NEIN
</button>

</div>

</div>
</div>


<!-- TELEFON -->

<div class="acc">

<button
  class="acc-head"
  aria-expanded="false"
  data-panel="phonePanel">

<span>📞 Telefon-Soforthilfe</span>
<span>⌄</span>

</button>

<div
  class="panel"
  id="phonePanel">

<div class="quick">

<button data-say="Hallo.">
👋 Hallo
</button>

<button data-say="Einen Moment bitte.">
⏳ Moment
</button>

<button data-say="Bitte wiederholen Sie das.">
🔁 Wiederholen
</button>

<button data-say="Bitte sprechen Sie langsamer.">
🐢 Langsamer
</button>

<button data-say="Ich kommuniziere über eine Sprachausgabe.">
🔊 Sprachausgabe
</button>

<button data-say="Danke. Auf Wiederhören.">
☎️ Auf Wiederhören
</button>

</div>

</div>
</div>


<!-- KI -->

<div class="acc">

<button
  class="acc-head"
  aria-expanded="false"
  data-panel="aiPanel">

<span>🧠 Intelligente Antworten</span>
<span>⌄</span>

</button>

<div
  class="panel"
  id="aiPanel">

<textarea
  id="questionInput"
  placeholder="Frage oder Gesprächssituation eingeben"
  aria-label="Frage oder Gesprächssituation">
</textarea>

<button
  class="full"
  id="askAI">
✨ Antworten erzeugen
</button>

<div
  class="question">

<small>
Aktuelle Frage / Situation
</small>

<span id="currentQuestion">
Noch keine Frage eingegeben.
</span>

</div>

<div
  class="answers"
  id="answers"
  role="group"
  aria-label="Antwortvorschläge">
</div>

</div>
</div>


<!-- EIGENER TEXT -->

<div class="acc">

<button
  class="acc-head"
  aria-expanded="false"
  data-panel="writePanel">

<span>✍️ Selbst schreiben</span>
<span>⌄</span>

</button>

<div
  class="panel"
  id="writePanel">

<textarea
  id="ownText"
  placeholder="Was möchtest du sagen?"
  aria-label="Eigenen Text schreiben">
</textarea>

<button
  class="full"
  id="speakOwn">
🔊 Sprechen
</button>

</div>
</div>


<!-- PERSÖNLICHE PHRASEN -->

<div class="acc">

<button
  class="acc-head"
  aria-expanded="false"
  data-panel="profilePanel">

<span>👤 Meine Phrasen</span>
<span>⌄</span>

</button>

<div
  class="panel"
  id="profilePanel">

<input
  id="userName"
  type="text"
  placeholder="Benutzername"
  aria-label="Benutzername">

<button
  class="full"
  id="openUser">
👤 Profil öffnen
</button>

<p>
Aktives Profil:
<strong id="activeUser">Keines</strong>
</p>

<input
  id="newPhrase"
  type="text"
  placeholder="Neue persönliche Phrase"
  aria-label="Neue persönliche Phrase">

<button
  class="full"
  id="savePhrase">
💾 Phrase speichern
</button>

<div id="userPhrases"></div>

</div>
</div>

</main>


<script>

/* ========================================
   TONGUEBOX PATENT-TEST
======================================== */

const ENDPOINT =
"https://tonguebox-ai.restless-bush-f37f.workers.dev/";

const statusEl =
document.getElementById("status");

const answersEl =
document.getElementById("answers");

const questionInput =
document.getElementById("questionInput");

const currentQuestion =
document.getElementById("currentQuestion");

const ownText =
document.getElementById("ownText");

let currentMode = "communication";


/* ========================================
   STATUS
======================================== */

function setStatus(text, error=false) {

  statusEl.textContent = text;

  statusEl.classList.toggle(
    "error",
    error
  );
}


/* ========================================
   SPRACHAUSGABE
======================================== */

function speak(text) {

  text = (text || "").trim();

  if (!text) {
    return;
  }

  if (!("speechSynthesis" in window)) {

    setStatus(
      "Sprachausgabe wird von diesem Browser nicht unterstützt.",
      true
    );

    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "de-AT";

  utterance.rate = 1;

  utterance.onstart = function() {

    setStatus(
      "🔊 Tonguebox spricht …"
    );
  };

  utterance.onend = function() {

    setStatus(
      "Bereit."
    );
  };

  utterance.onerror = function() {

    setStatus(
      "Sprachausgabe konnte nicht gestartet werden.",
      true
    );
  };

  speechSynthesis.speak(
    utterance
  );
}


/* ========================================
   DATA-SAY BUTTONS
======================================== */

document
.querySelectorAll("[data-say]")
.forEach(function(button) {

  button.addEventListener(
    "click",
    function() {

      speak(
        button.dataset.say
      );
    }
  );

});


/* ========================================
   AKKORDEON
======================================== */

function openPanel(id) {

  document
  .querySelectorAll(".acc-head")
  .forEach(function(header) {

    const panel =
      document.getElementById(
        header.dataset.panel
      );

    const shouldOpen =
      header.dataset.panel === id;

    header.setAttribute(
      "aria-expanded",
      shouldOpen ? "true" : "false"
    );

    if (panel) {

      panel.classList.toggle(
        "open",
        shouldOpen
      );
    }

    const arrow =
      header.querySelector(
        "span:last-child"
      );

    if (arrow) {

      arrow.textContent =
        shouldOpen ? "⌃" : "⌄";
    }

  });


  const selected =
    document.querySelector(
      '.acc-head[data-panel="' +
      id +
      '"]'
    );

  if (selected) {

    setTimeout(function() {

      selected.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }, 80);
  }
}


document
.querySelectorAll(".acc-head")
.forEach(function(header) {

  header.addEventListener(
    "click",
    function() {

      const id =
        header.dataset.panel;

      const currentlyOpen =
        header.getAttribute(
          "aria-expanded"
        ) === "true";

      if (currentlyOpen) {

        header.setAttribute(
          "aria-expanded",
          "false"
        );

        document
        .getElementById(id)
        .classList.remove("open");

        const arrow =
          header.querySelector(
            "span:last-child"
          );

        if (arrow) {
          arrow.textContent = "⌄";
        }

      } else {

        openPanel(id);
      }

    }
  );

});


/* ========================================
   KOMMUNIKATIONS-MODUS
======================================== */

const communicationMode =
document.getElementById(
  "communicationMode"
);

const phoneMode =
document.getElementById(
  "phoneMode"
);


function setMode(mode) {

  currentMode = mode;

  if (mode === "phone") {

    document.body.classList.add(
      "phone-mode"
    );

    phoneMode.className =
      "mode-active";

    communicationMode.className =
      "mode-inactive";

    setStatus(
      "📞 Telefonmodus aktiviert."
    );

    openPanel(
      "phonePanel"
    );

  } else {

    document.body.classList.remove(
      "phone-mode"
    );

    communicationMode.className =
      "mode-active";

    phoneMode.className =
      "mode-inactive";

    setStatus(
      "💬 Kommunikationsmodus aktiviert."
    );

    openPanel(
      "yesNoPanel"
    );
  }
}


communicationMode.onclick =
function() {

  setMode(
    "communication"
  );
};


phoneMode.onclick =
function() {

  setMode(
    "phone"
  );
};


/* ========================================
   JA/NEIN ERKENNUNG
======================================== */

function looksLikeYesNoQuestion(text) {

  const q =
    text
    .trim()
    .toLowerCase();

  const starts = [

    "bist ",
    "bist du",
    "hast ",
    "hast du",
    "kannst ",
    "kannst du",
    "möchtest ",
    "möchtest du",
    "willst ",
    "willst du",
    "soll ",
    "soll ich",
    "darf ",
    "darf ich",
    "ist ",
    "sind ",
    "war ",
    "waren ",
    "kommst ",
    "gehst ",
    "brauchst ",
    "magst "

  ];

  return starts.some(
    function(start) {

      return q.startsWith(start);
    }
  );
}


/* ========================================
   ANTWORTEN ANZEIGEN
======================================== */

function renderAnswers(list) {

  answersEl.innerHTML = "";

  let replies =
    Array.isArray(list)
    ? list.filter(Boolean)
    : [];

  replies =
    replies.slice(0,4);

  const fallback = [

    "Ja.",
    "Nein.",
    "Einen Moment bitte.",
    "Bitte wiederholen."

  ];

  while (
    replies.length < 4
  ) {

    replies.push(
      fallback[
        replies.length
      ]
    );
  }


  replies.forEach(
    function(text) {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "answer";

      button.textContent =
        text;

      button.setAttribute(
        "aria-label",
        "Antwort: " + text
      );

      button.onclick =
        function() {

          speak(text);
        };

      answersEl.appendChild(
        button
      );
    }
  );
}


/* ========================================
   KI
======================================== */

async function askAI(question) {

  question =
    (question || "").trim();

  if (!question) {

    setStatus(
      "Bitte zuerst eine Frage eingeben.",
      true
    );

    return;
  }


  currentQuestion.textContent =
    question;


  /*
    ADAPTIVE BLICKOBERFLÄCHE

    Wird eine Ja/Nein-Frage erkannt,
    wird zuerst die reduzierte
    Ja/Nein-Oberfläche angezeigt.
  */

  if (
    looksLikeYesNoQuestion(
      question
    )
  ) {

    setStatus(
      "⚡ Ja/Nein-Frage erkannt."
    );

    openPanel(
      "yesNoPanel"
    );

  } else {

    openPanel(
      "aiPanel"
    );
  }


  setStatus(
    "🧠 Antworten werden erstellt …"
  );


  try {

    const response =
      await fetch(
        ENDPOINT,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              question:
                question,

              mode:
                currentMode

            })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.detail ||
        data.error ||
        "HTTP " +
        response.status
      );
    }


    if (
      !Array.isArray(
        data.replies
      )
    ) {

      throw new Error(
        "Keine Antworten erhalten."
      );
    }


    renderAnswers(
      data.replies
    );


    setStatus(
      "✨ Antworten sind bereit."
    );


    /*
      Bei normalen Fragen:
      Antworten anzeigen.

      Bei Ja/Nein-Fragen:
      JA/NEIN bleibt zuerst sichtbar.
    */

    if (
      !looksLikeYesNoQuestion(
        question
      )
    ) {

      openPanel(
        "aiPanel"
      );
    }

  }

  catch(error) {

    console.error(error);

    setStatus(
      "KI-Verbindung nicht erreichbar. Schnellkommunikation bleibt verfügbar.",
      true
    );

    renderAnswers([
      "Ja.",
      "Nein.",
      "Einen Moment bitte.",
      "Bitte wiederholen."
    ]);
  }
}


document
.getElementById(
  "askAI"
)
.onclick =
function() {

  askAI(
    questionInput.value
  );
};


/* ========================================
   EIGENER TEXT
======================================== */

document
.getElementById(
  "speakOwn"
)
.onclick =
function() {

  speak(
    ownText.value
  );
};


/* ========================================
   BENUTZERPROFILE
======================================== */

const USER_PREFIX =
"tonguebox_patent_user_";

let activeUser = "";


function getPhrases() {

  if (!activeUser) {
    return [];
  }

  try {

    return JSON.parse(
      localStorage.getItem(
        USER_PREFIX +
        activeUser.toLowerCase()
      ) || "[]"
    );

  }

  catch(error) {

    return [];
  }
}


function savePhrases(
  phrases
) {

  if (!activeUser) {
    return;
  }

  try {

    localStorage.setItem(
      USER_PREFIX +
      activeUser.toLowerCase(),

      JSON.stringify(
        phrases
      )
    );

  }

  catch(error) {

    console.error(error);
  }
}


function renderUserPhrases() {

  const container =
    document.getElementById(
      "userPhrases"
    );

  container.innerHTML = "";


  getPhrases()
  .forEach(
    function(phrase,index) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "phrase";


      const speakButton =
        document.createElement(
          "button"
        );

      speakButton.className =
        "speak";

      speakButton.textContent =
        phrase;

      speakButton.onclick =
        function() {

          speak(
            phrase
          );
        };


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "🗑";

      deleteButton.setAttribute(
        "aria-label",
        "Phrase löschen"
      );

      deleteButton.onclick =
        function() {

          const phrases =
            getPhrases();

          phrases.splice(
            index,
            1
          );

          savePhrases(
            phrases
          );

          renderUserPhrases();

          setStatus(
            "Phrase gelöscht."
          );
        };


      row.appendChild(
        speakButton
      );

      row.appendChild(
        deleteButton
      );

      container.appendChild(
        row
      );

    }
  );
}


/* PROFIL ÖFFNEN */

document
.getElementById(
  "openUser"
)
.onclick =
function() {

  const name =
    document
    .getElementById(
      "userName"
    )
    .value
    .trim()
    .slice(0,40);


  if (!name) {

    setStatus(
      "Bitte einen Benutzernamen eingeben.",
      true
    );

    return;
  }


  activeUser =
    name;


  document
  .getElementById(
    "activeUser"
  )
  .textContent =
    name;


  try {

    localStorage.setItem(
      "tonguebox_active_user",
      name
    );

  }

  catch(error) {}


  renderUserPhrases();


  setStatus(
    "👤 Profil " +
    name +
    " geöffnet."
  );
};


/* PHRASE SPEICHERN */

document
.getElementById(
  "savePhrase"
)
.onclick =
function() {

  if (!activeUser) {

    setStatus(
      "Bitte zuerst ein Profil öffnen.",
      true
    );

    return;
  }


  const input =
    document.getElementById(
      "newPhrase"
    );

  const phrase =
    input.value.trim();


  if (!phrase) {

    setStatus(
      "Bitte eine Phrase eingeben.",
      true
    );

    return;
  }


  const phrases =
    getPhrases();


  if (
    !phrases.includes(
      phrase
    )
  ) {

    phrases.push(
      phrase
    );

    savePhrases(
      phrases
    );
  }


  input.value = "";


  renderUserPhrases();


  setStatus(
    "💬 Phrase gespeichert."
  );
};


/* ========================================
   PROFIL WIEDERHERSTELLEN
======================================== */

try {

  const savedUser =
    localStorage.getItem(
      "tonguebox_active_user"
    );

  if (savedUser) {

    document
    .getElementById(
      "userName"
    )
    .value =
      savedUser;

    activeUser =
      savedUser;

    document
    .getElementById(
      "activeUser"
    )
    .textContent =
      savedUser;

    renderUserPhrases();
  }

}
