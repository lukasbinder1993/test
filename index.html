<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tonguebox User</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#10232a}main,.box{max-width:700px;margin:auto;padding:14px}h1{text-align:center}.note,.status{padding:14px;text-align:center;font-weight:800}.note{border:2px solid #087f8c;border-radius:18px}.acc{margin:15px 0;border:2px solid #ccd9dc;border-radius:20px;overflow:hidden}.head,.btn{width:100%;min-height:105px;border:0;border-radius:18px;background:#087f8c;color:white;font-size:23px;font-weight:800;padding:16px}.head{border-radius:0;text-align:left}.panel{display:none;padding:14px}.panel.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid .btn{min-height:120px}textarea,input{width:100%;min-height:76px;margin:8px 0;padding:14px;border:3px solid #ccd9dc;border-radius:16px;font-size:21px}textarea{min-height:115px}.auth{position:fixed;inset:0;background:white;z-index:9;overflow:auto}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.phrase{display:grid;grid-template-columns:1fr auto;gap:10px;margin:10px 0}.phrase .del{background:#a21d1d;min-width:90px}.error{color:#a21d1d}.hide{display:none}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:7px solid #ffd400;outline-offset:3px}@media(max-width:480px){.grid{grid-template-columns:1fr}.btn,.head{min-height:112px}}
</style></head><body>
<div class="auth" id="auth"><div class="box"><h1>👤 Tonguebox</h1><div class="tabs"><button class="btn" id="loginTab">Anmelden</button><button class="btn" id="regTab">Registrieren</button></div><div id="nameBox" class="hide"><input id="name" placeholder="Name"></div><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort – mindestens 8 Zeichen"><button class="btn" id="authGo">🔐 Anmelden</button><div class="status error" id="authMsg"></div></div></div>
<main><h1>🧠 Tonguebox</h1><div class="note">✨ KI-generierte Antwortvorschläge · Internetverbindung erforderlich</div><div class="status" id="status">Bereit.</div>
<div class="acc"><button class="head" data-p="ai">⚡ KI-Antworten</button><div class="panel open" id="ai"><textarea id="question" placeholder="Frage eingeben …"></textarea><button class="btn" id="ask">✨ KI-Antworten erzeugen</button><div class="grid" id="answers"></div></div></div>
<div class="acc"><button class="head" data-p="phrases">⭐ Meine Phrasen</button><div class="panel" id="phrases"><textarea id="newPhrase" placeholder="Eigene Phrase eingeben …"></textarea><button class="btn" id="savePhrase">💾 Phrase speichern</button><div id="phraseList"></div></div></div>
<div class="acc"><button class="head" data-p="quick">💬 Sofort-Kommunikation</button><div class="panel" id="quick"><div class="grid"><button class="btn" data-say="Ja.">Ja</button><button class="btn" data-say="Nein.">Nein</button><button class="btn" data-say="Einen Moment bitte.">Moment</button><button class="btn" data-say="Bitte wiederholen.">Wiederholen</button></div></div></div>
<div class="acc"><button class="head" data-p="account">👤 Mein Konto</button><div class="panel" id="account"><div class="status" id="who"></div><button class="btn" id="logout">Abmelden</button></div></div></main>
<script>
const AI="https://tonguebox-ai.restless-bush-f37f.workers.dev/";
const USERS="https://tonguebox-users.restless-bush-f37f.workers.dev";
let mode="login",token=localStorage.getItem("tb_token")||"";
const $=id=>document.getElementById(id),stat=t=>$("status").textContent=t;
function speak(t){if(!t)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="de-AT";speechSynthesis.speak(u)}
function renderAnswers(a){$("answers").innerHTML="";(a||[]).slice(0,4).forEach(t=>{let b=document.createElement("button");b.className="btn";b.textContent=t;b.onclick=()=>speak(t);$("answers").appendChild(b)})}
async function api(path,opt={}){opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{});if(token)opt.headers.Authorization="Bearer "+token;let r=await fetch(USERS+path,opt),d=await r.json();if(!r.ok)throw Error(d.error||"Fehler");return d}
function authMode(m){mode=m;$("nameBox").classList.toggle("hide",m!=="register");$("authGo").textContent=m==="register"?"✨ Konto erstellen":"🔐 Anmelden";$("authMsg").textContent=""}
$("loginTab").onclick=()=>authMode("login");$("regTab").onclick=()=>authMode("register");
$("authGo").onclick=async()=>{try{let d=await api(mode==="register"?"/register":"/login",{method:"POST",body:JSON.stringify({name:$("name").value.trim(),email:$("email").value.trim(),password:$("password").value})});token=d.token;localStorage.setItem("tb_token",token);$("who").textContent=d.user.name||d.user.email;$("auth").style.display="none";loadPhrases()}catch(e){$("authMsg").textContent=e.message}};
async function restore(){if(!token)return;try{let d=await api("/me");$("who").textContent=d.user.name||d.user.email;$("auth").style.display="none";loadPhrases()}catch(e){localStorage.removeItem("tb_token");token=""}}
$("logout").onclick=()=>{localStorage.removeItem("tb_token");token="";$("auth").style.display="block"};
$("ask").onclick=async()=>{let q=$("question").value.trim();if(!q)return;stat("✨ KI erstellt Antworten …");try{let r=await fetch(AI,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})}),d=await r.json();if(!r.ok)throw Error(d.error||"KI-Fehler");renderAnswers(d.replies);stat("✨ KI-generierte Antworten bereit.")}catch(e){stat("KI nicht erreichbar.")}};
async function loadPhrases(){try{let d=await api("/phrases");$("phraseList").innerHTML="";d.phrases.forEach(p=>{let row=document.createElement("div");row.className="phrase";let b=document.createElement("button");b.className="btn";b.textContent=p.text;b.onclick=()=>speak(p.text);let del=document.createElement("button");del.className="btn del";del.textContent="Löschen";del.onclick=async()=>{await api("/phrases/"+p.id,{method:"DELETE"});loadPhrases()};row.append(b,del);$("phraseList").appendChild(row)})}catch(e){}}
$("savePhrase").onclick=async()=>{let text=$("newPhrase").value.trim();if(!text)return;await api("/phrases",{method:"POST",body:JSON.stringify({text})});$("newPhrase").value="";loadPhrases()};
document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
document.querySelectorAll(".head").forEach(h=>h.onclick=()=>{let id=h.dataset.p,was=$(id).classList.contains("open");document.querySelectorAll(".panel").forEach(p=>p.classList.remove("open"));if(!was){$(id).classList.add("open");setTimeout(()=>h.scrollIntoView({behavior:"smooth",block:"start"}),50)}});
restore();
</script></body></html>
